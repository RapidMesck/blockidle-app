name: Release

on:
  push:
    branches:
      - main
    paths:
      - "Cargo.toml"
      - ".github/workflows/release.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional version tag override (e.g. v0.1.0). Defaults to version in Cargo.toml."
        required: false
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  check-version:
    name: Check Cargo.toml Version
    runs-on: ubuntu-24.04
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect version change and create tag if needed
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          CARGO_VERSION=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)
          if [ -z "$CARGO_VERSION" ]; then
            echo "Error: Could not read version from Cargo.toml"
            exit 1
          fi

          if [ -n "$INPUT_TAG" ]; then
            TAG="${INPUT_TAG}"
            VERSION="${TAG#v}"
          else
            VERSION="${CARGO_VERSION}"
            TAG="v${VERSION}"
          fi

          echo "Detected version: ${VERSION} (tag: ${TAG})"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists. Skipping release build."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git rev-parse "${TAG}" >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "${TAG}" -m "Release ${TAG}"
            git push origin "${TAG}"
          fi

          echo "should_release=true" >> "$GITHUB_OUTPUT"

  build-linux:
    name: Build Linux x86_64 (.tar.gz, .deb & .AppImage)
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            pkg-config \
            build-essential \
            file \
            desktop-file-utils \
            curl \
            ca-certificates

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo build
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --locked

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package Linux tar.gz, .deb and .AppImage
        env:
          VERSION: ${{ needs.check-version.outputs.version }}
          TAG: ${{ needs.check-version.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p dist

          strip target/release/blockidle-app

          # 1. Portable .tar.gz archive
          STAGE_DIR="blockidle-app-${TAG}-linux-x86_64"
          mkdir -p "${STAGE_DIR}"
          cp target/release/blockidle-app "${STAGE_DIR}/blockidle-app"
          cp assets/icons/icon.png "${STAGE_DIR}/icon.png"
          cp assets/icons/favicon.ico "${STAGE_DIR}/favicon.ico"
          chmod 755 "${STAGE_DIR}/blockidle-app"
          tar -czf "dist/${STAGE_DIR}.tar.gz" "${STAGE_DIR}"
          cp target/release/blockidle-app "dist/blockidle-app-${TAG}-linux-x86_64"
          chmod 755 "dist/blockidle-app-${TAG}-linux-x86_64"

          # 2. Debian/Ubuntu .deb package
          DEB_DIR="deb-pkg/blockidle-app_${VERSION}_amd64"
          mkdir -p "${DEB_DIR}/DEBIAN"
          mkdir -p "${DEB_DIR}/usr/bin"
          mkdir -p "${DEB_DIR}/usr/share/applications"
          mkdir -p "${DEB_DIR}/usr/share/icons/hicolor/scalable/apps"
          mkdir -p "${DEB_DIR}/usr/share/icons/hicolor/256x256/apps"
          mkdir -p "${DEB_DIR}/usr/share/icons/hicolor/64x64/apps"
          mkdir -p "${DEB_DIR}/usr/share/icons/hicolor/32x32/apps"
          mkdir -p "${DEB_DIR}/usr/share/pixmaps"

          cp target/release/blockidle-app "${DEB_DIR}/usr/bin/blockidle-app"
          chmod 755 "${DEB_DIR}/usr/bin/blockidle-app"
          cp assets/icons/blockidle.svg "${DEB_DIR}/usr/share/icons/hicolor/scalable/apps/blockidle.svg"
          cp assets/icons/icon-256.png "${DEB_DIR}/usr/share/icons/hicolor/256x256/apps/blockidle.png"
          cp assets/icons/favicon-64.png "${DEB_DIR}/usr/share/icons/hicolor/64x64/apps/blockidle.png"
          cp assets/icons/favicon.png "${DEB_DIR}/usr/share/icons/hicolor/32x32/apps/blockidle.png"
          cp assets/icons/icon.png "${DEB_DIR}/usr/share/pixmaps/blockidle.png"

          cat > "${DEB_DIR}/usr/share/applications/blockidle.desktop" << 'EOF'
          [Desktop Entry]
          Name=Blockidle
          GenericName=Blockidle Client
          Comment=Native desktop client for Blockidle (https://blockidle.io/play)
          Exec=/usr/bin/blockidle-app
          Icon=blockidle
          Terminal=false
          Type=Application
          Categories=Game;
          StartupWMClass=blockidle-app
          EOF

          cat > "${DEB_DIR}/DEBIAN/control" << EOF
          Package: blockidle-app
          Version: ${VERSION}
          Section: games
          Priority: optional
          Architecture: amd64
          Depends: libwebkit2gtk-4.1-0, libgtk-3-0, libayatana-appindicator3-1
          Maintainer: rapidmesck <mesckpvp.mine@gmail.com>
          Homepage: https://github.com/RapidMesck/blockidle-app
          Description: Native desktop client shell for Blockidle (https://blockidle.io/play)
          EOF

          dpkg-deb --build --root-owner-group "${DEB_DIR}" "dist/blockidle-app_${VERSION}_amd64.deb"

          # 3. Linux AppImage (.AppImage)
          APPDIR="blockidle-app.AppDir"
          mkdir -p "${APPDIR}/usr/bin"
          mkdir -p "${APPDIR}/usr/share/applications"
          mkdir -p "${APPDIR}/usr/share/icons/hicolor/scalable/apps"
          mkdir -p "${APPDIR}/usr/share/icons/hicolor/256x256/apps"
          mkdir -p "${APPDIR}/usr/share/pixmaps"

          cp target/release/blockidle-app "${APPDIR}/usr/bin/blockidle-app"
          chmod 755 "${APPDIR}/usr/bin/blockidle-app"

          cp assets/icons/icon-256.png "${APPDIR}/blockidle.png"
          cp assets/icons/blockidle.svg "${APPDIR}/blockidle.svg"
          cp assets/icons/icon-256.png "${APPDIR}/.DirIcon"
          cp assets/icons/icon-256.png "${APPDIR}/usr/share/icons/hicolor/256x256/apps/blockidle.png"
          cp assets/icons/blockidle.svg "${APPDIR}/usr/share/icons/hicolor/scalable/apps/blockidle.svg"
          cp assets/icons/icon.png "${APPDIR}/usr/share/pixmaps/blockidle.png"

          cat > "${APPDIR}/blockidle.desktop" << 'EOF'
          [Desktop Entry]
          Name=Blockidle
          GenericName=Blockidle Client
          Comment=Native desktop client for Blockidle (https://blockidle.io/play)
          Exec=blockidle-app
          Icon=blockidle
          Terminal=false
          Type=Application
          Categories=Game;
          StartupWMClass=blockidle-app
          EOF
          cp "${APPDIR}/blockidle.desktop" "${APPDIR}/usr/share/applications/blockidle.desktop"

          cat > "${APPDIR}/AppRun" << 'EOF'
          #!/bin/sh
          SELF=$(readlink -f "$0")
          HERE=${SELF%/*}
          export PATH="${HERE}/usr/bin:${PATH}"
          exec "${HERE}/usr/bin/blockidle-app" "$@"
          EOF
          chmod 755 "${APPDIR}/AppRun"

          curl -fsSL -o appimagetool-x86_64.AppImage \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x appimagetool-x86_64.AppImage
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool-x86_64.AppImage \
            "${APPDIR}" "dist/blockidle-app-${TAG}-x86_64.AppImage"
          chmod 755 "dist/blockidle-app-${TAG}-x86_64.AppImage"

          cd dist
          sha256sum * > SHA256SUMS-linux-x86_64.txt

      - name: Upload Linux release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-x86_64
          path: dist/*

  build-windows:
    name: Build Windows x86_64 (.zip & .exe)
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo build
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --locked

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package Windows artifacts
        shell: bash
        env:
          VERSION: ${{ needs.check-version.outputs.version }}
          TAG: ${{ needs.check-version.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p dist

          cp target/release/blockidle-app.exe "dist/blockidle-app-${TAG}-windows-x86_64.exe"

          STAGE_DIR="blockidle-app-${TAG}-windows-x86_64"
          mkdir -p "${STAGE_DIR}"
          cp target/release/blockidle-app.exe "${STAGE_DIR}/blockidle-app.exe"
          cp assets/icons/favicon.ico "${STAGE_DIR}/favicon.ico"
          cp assets/icons/icon.png "${STAGE_DIR}/icon.png"
          7z a -tzip "dist/${STAGE_DIR}.zip" "${STAGE_DIR}"

          cd dist
          sha256sum * > SHA256SUMS-windows-x86_64.txt

      - name: Upload Windows release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-x86_64
          path: dist/*

  publish-release:
    name: Publish GitHub Release
    needs:
      - check-version
      - build-linux
      - build-windows
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Consolidate SHA256SUMS.txt
        run: |
          cd artifacts
          cat SHA256SUMS-linux-x86_64.txt SHA256SUMS-windows-x86_64.txt > SHA256SUMS.txt
          rm -f SHA256SUMS-linux-x86_64.txt SHA256SUMS-windows-x86_64.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check-version.outputs.tag }}
          name: "Blockidle Desktop ${{ needs.check-version.outputs.tag }}"
          generate_release_notes: true
          files: artifacts/*
