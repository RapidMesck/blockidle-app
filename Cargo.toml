[package]
name = "blockidle-app"
version = "0.3.0"
edition = "2024"
description = "Native desktop client shell for Blockidle (https://blockidle.io/play)"
license = "MIT"
authors = ["rapidmesck <mesckpvp.mine@gmail.com>"]
repository = "https://github.com/RapidMesck/blockidle-app"
homepage = "https://github.com/RapidMesck/blockidle-app"

[dependencies]
directories = "6"
muda = { version = "0.16", default-features = false }
open = "5"
ring = "0.17"
self-replace = "1.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tao = "0.33"
tray-icon = { version = "0.20", default-features = false }
ureq = { version = "2.10", default-features = false, features = ["tls", "gzip"] }
url = "2"
wry = "0.51"

[dev-dependencies]
tempfile = "3"

[target."cfg(windows)".build-dependencies]
winres = "0.1.12"
